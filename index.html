<style>
  main { padding-top: 2.5rem; }
  h1 { font-size: 2rem; }
  .blurb { font-size: 1.05rem; margin-bottom: 2rem; }

  #cards {
    display: grid; gap: 1.25rem; margin: 0 0 2rem;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  }
  .card {
    display: flex; flex-direction: column; text-decoration: none; color: inherit;
    border: 1px solid var(--rule); border-radius: 9px; overflow: hidden;
    background: #fff; transition: border-color .12s, box-shadow .12s, transform .12s;
  }
  .card:hover, .card:focus-visible {
    border-color: #c7cbd1; box-shadow: 0 6px 20px rgba(0,0,0,.09); transform: translateY(-2px);
  }
  .card img { display: block; width: 100%; height: auto; background: #fff; }
  .card-text { padding: .7rem .9rem 1rem; border-top: 1px solid var(--rule); }
  .card-text strong { display: block; font-size: 1rem; font-weight: 650; margin-bottom: .15rem; }
  .card-text span { font-size: .85rem; color: var(--ink-muted); line-height: 1.35; }

  /* The last card is the odd one out -- a different question and a different
     colour encoding -- so it reads as a coda rather than a fifth model. */
  .card:last-child { grid-column: 1 / -1; flex-direction: row; align-items: center; }
  .card:last-child img { width: min(60%, 620px); }
  .card:last-child .card-text { border-top: none; border-left: 1px solid var(--rule); flex: 1; }
  @media (max-width: 560px) {
    .card:last-child { flex-direction: column; }
    .card:last-child img { width: 100%; }
    .card:last-child .card-text { border-left: none; border-top: 1px solid var(--rule); }
  }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="blurb" id="blurb"></p>

  <div id="cards"></div>

  <p class="note" id="note"></p>

  <footer>
    <div id="credit"></div>
  </footer>
</main>
